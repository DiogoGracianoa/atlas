name: keepalive

# Uma consulta por dia ao Supabase para o projeto Free não ser pausado por
# inatividade (pausa após 7 dias sem requisições). Falha se a resposta não
# for 200, e o GitHub avisa por e-mail.
on:
  schedule:
    - cron: "17 9 * * *"   # todo dia, 09:17 UTC (06:17 em Brasília)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: SELECT em heartbeat
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: bash scripts/keepalive.sh
